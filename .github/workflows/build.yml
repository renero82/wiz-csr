name: Build portable apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pyi_args: --onefile
          - os: macos-latest
            pyi_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pillow

      - name: Build
        run: pyinstaller --noconsole --windowed ${{ matrix.pyi_args }} --name WizCSR app.py

      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WizCSR.exe" -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/WizCSR.app/Contents/MacOS/WizCSR --selftest selftest.txt || { cat selftest.txt; exit 1; }
          cat selftest.txt

      - name: Screenshots
        continue-on-error: true
        run: python scripts/screenshot.py

      - name: Package macOS
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent WizCSR.app WizCSR-macOS.zip

      - name: Rename Windows exe
        if: runner.os == 'Windows'
        run: Copy-Item dist/WizCSR.exe dist/WizCSR-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WizCSR-${{ runner.os }}
          path: |
            dist/WizCSR-Windows.exe
            dist/WizCSR-macOS.zip
            selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ runner.os }}
          path: docs/*.png
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WizCSR-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" WizCSR-Windows.exe WizCSR-macOS.zip \
            --repo "${{ github.repository }}" --title "Wiz CSR ${{ github.ref_name }}" --generate-notes
