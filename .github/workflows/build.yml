name: Build portable apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build
        run: pyinstaller --noconsole --onefile --windowed --name WizCSR app.py
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd dist && zip -r WizCSR-mac.zip WizCSR.app
      - uses: actions/upload-artifact@v4
        with:
          name: WizCSR-${{ runner.os }}
          path: |
            dist/WizCSR.exe
            dist/WizCSR-mac.zip
